name: Deploy Website AIEO Checker to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static GitHub Pages site
        run: |
          set -e
          restore_api() {
            if [ -d app/api-disabled ]; then
              mv app/api-disabled app/api
            fi
          }
          trap restore_api EXIT
          if [ -d app/api ]; then
            mv app/api app/api-disabled
          fi
          npm run build
        env:
          GITHUB_PAGES: true
          NEXT_PUBLIC_SITE_URL: https://skydevlab.github.io/Aieo/
          NEXT_PUBLIC_API_BASE_URL: https://website-aieo.vercel.app

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
